name: Backup

# The decision chain, pulled off Railway's volume into a repo we own.
#
# That volume is the ONLY copy of the audit trail, and from Sprint 8 it is the
# MAINNET audit trail. Railway's Backups Pro was the alternative; the founder
# chose this (S65) so the second copy lives somewhere Rein controls rather than
# somewhere Railway controls -- a provider outage and a provider account
# problem are the same loss otherwise.
#
# It runs with the READ-scoped key. A backup job that could also spend is a
# worse backup job, and `REIN_KEY_READ` is exactly the key that cannot.
on:
  schedule:
    # Nightly, off the hour and clear of the 06:17 live run -- that one spends
    # money and writes decisions, so backing up after it is the useful order.
    - cron: '43 7 * * *'
  workflow_dispatch:

# One writer at a time: two runs pushing to the backup repo race on the same
# branch, and the loser's export is simply lost. Not cancel-in-progress -- a
# half-finished push is worse than a late one.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: export decision chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'

    # Job-level so the notify step's `if:` can test the token without the
    # secret reaching every other step.
    env:
      REIN_TELEGRAM_BOT_TOKEN: ${{ secrets.REIN_TELEGRAM_BOT_TOKEN }}
      REIN_TELEGRAM_CHAT_ID: ${{ secrets.REIN_TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only the workspace the script imports -- the backup does not need the
      # engine, the console or the rails built to read an HTTP route.
      - name: Build core
        run: pnpm --filter @reinconsole/core build

      # A separate PRIVATE repo, not this one: the chain names vendors, amounts
      # and agent ids, and this repo is public.
      - name: Check out the backup repo
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.REIN_BACKUP_REPO }}
          token: ${{ secrets.REIN_BACKUP_TOKEN }}
          path: .backup-repo

      - name: Export and verify
        env:
          REIN_ENGINE_URL: ${{ secrets.REIN_E2E_ENGINE_URL }}
          REIN_KEY_READ: ${{ secrets.REIN_KEY_READ }}
        run: node scripts/export-decisions.mjs --out .backup-repo/decisions

      # Nothing to commit is the NORMAL outcome on a quiet day -- the export is
      # byte-identical when no decision was made -- so it must not fail the run.
      - name: Commit and push
        working-directory: .backup-repo
        run: |
          git config user.name 'rein-backup'
          git config user.email 'rein-backup@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No new decisions since the last export.'
            exit 0
          fi
          git commit -m "decisions: export $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      # The manifest is the thing to read when something looks wrong: it says
      # how many decisions were verified and whether the export was rooted.
      - name: Manifest
        run: cat .backup-repo/decisions/latest.json

      # This workflow ran with NO alarm until 2026-09-21, which is why a broken
      # hosted engine cost two nights of backups before anyone noticed. A
      # nightly that fails silently is indistinguishable from one that never
      # ran; the whole point of the job is the copy existing when Railway's is
      # gone, and that is exactly when nobody is looking.
      #
      # `sh scripts/...` rather than executing it directly: a Windows checkout
      # does not preserve the exec bit, and an alarm that only runs on some
      # checkouts is the failure mode this file is about.
      - name: Notify on failure
        if: failure() && env.REIN_TELEGRAM_BOT_TOKEN != ''
        run: >
          sh scripts/notify-telegram.sh
          "Rein nightly backup FAILED -- the decision chain was NOT exported.
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # The WHOLE engine database (Sprint 11.4), once the engine runs on Supabase:
  # every table, every org's decisions -- the export above sees only what the
  # read key's org can (3 of 6 at S69, `rooted: false`). Supabase Free keeps
  # no backups we can rely on, so this is the copy.
  #
  # A dump is only a backup if it RESTORES: each night it is loaded into a
  # scratch Postgres 17 and the decision chain is verified under the key
  # stored beside it (scripts/verify-dump.mjs) BEFORE anything is committed.
  #
  # Dormant until the secret exists: before the cutover there is no database
  # to dump, and a missing secret must read as "not yet", not as a failure.
  # After the HTTP export (`needs`), because both push to the same repo.
  postgres-dump:
    name: dump engine database
    needs: backup
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      REIN_BACKUP_DATABASE_URL: ${{ secrets.REIN_BACKUP_DATABASE_URL }}
      # The PUBLIC half of an age key (`age1...`). The private half is held by
      # the founder offline and never reaches CI: a runner that can encrypt
      # cannot read last month's dumps.
      REIN_BACKUP_AGE_RECIPIENT: ${{ secrets.REIN_BACKUP_AGE_RECIPIENT }}
      # The schema the engine runs in (REIN_DB_SCHEMA on Railway). Never
      # `public` on Supabase: that one is exposed through its Data API.
      REIN_DB_SCHEMA: rein
      REIN_TELEGRAM_BOT_TOKEN: ${{ secrets.REIN_TELEGRAM_BOT_TOKEN }}
      REIN_TELEGRAM_CHAT_ID: ${{ secrets.REIN_TELEGRAM_CHAT_ID }}
    steps:
      - name: Enabled?
        id: gate
        run: |
          if [ -n "$REIN_BACKUP_DATABASE_URL" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'REIN_BACKUP_DATABASE_URL is not set -- the engine is not on Postgres yet; skipping.'
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      # The verifier needs the chain check and the Decision schema, nothing else.
      - name: Build the verifier's dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm --filter @reinconsole/policy-engine... build

      - name: Check out the backup repo
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.REIN_BACKUP_REPO }}
          token: ${{ secrets.REIN_BACKUP_TOKEN }}
          path: .backup-repo

      # Encrypted or not at all (privacy policy, "How long we keep data"): a
      # missing recipient FAILS the run rather than committing a plaintext dump.
      - name: Encryption key present?
        if: steps.gate.outputs.enabled == 'true'
        run: |
          case "$REIN_BACKUP_AGE_RECIPIENT" in
            age1*) ;;
            *) echo 'REIN_BACKUP_AGE_RECIPIENT is missing or not an age public key -- refusing to dump in plaintext'; exit 1 ;;
          esac
          sudo apt-get install -y -qq age >/dev/null
          age --version

      # pg_dump from the postgres:17 image: the runner's own client is older
      # than the server, and pg_dump refuses a newer server. The plaintext
      # stays on the runner, outside the backup repo, and dies with it.
      - name: Dump
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/dump"
          docker run --rm -e URL="$REIN_BACKUP_DATABASE_URL" -e SCHEMA="$REIN_DB_SCHEMA" postgres:17             sh -c 'pg_dump "$URL" --no-owner --no-privileges --schema="$SCHEMA"' > "$RUNNER_TEMP/dump/rein.sql"
          test -s "$RUNNER_TEMP/dump/rein.sql"

      - name: Restore into scratch and verify the chain
        if: steps.gate.outputs.enabled == 'true'
        env:
          REIN_VERIFY_URL: postgres://postgres:scratch@127.0.0.1:5432/restore
        run: |
          docker run --rm -i --network host postgres:17             psql "$REIN_VERIFY_URL" -q -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/dump/rein.sql"
          node scripts/verify-dump.mjs --manifest "$RUNNER_TEMP/dump/latest.json"

      # 90-day rolling retention. Dumps live on their own branch, rebuilt each
      # night as ONE orphan commit holding the last 90 days of encrypted files
      # and force-pushed, so an expired dump leaves no history behind. Git
      # history on main would keep every dump forever, which is exactly what a
      # retention window forbids. The HTTP decision export above stays on main.
      - name: Encrypt, prune past 90 days, push
        if: steps.gate.outputs.enabled == 'true'
        working-directory: .backup-repo
        run: |
          set -eu
          git config user.name 'rein-backup'
          git config user.email 'rein-backup@users.noreply.github.com'
          git worktree add --detach ../.dumps
          cd ../.dumps
          git checkout -q --orphan next
          git read-tree --empty && git clean -fdq
          if git fetch -q --depth 1 origin postgres-dumps; then
            git checkout FETCH_HEAD -- .
          fi
          today=$(date -u +%F)
          cutoff=$(date -u -d '90 days ago' +%F)
          age -r "$REIN_BACKUP_AGE_RECIPIENT" -o "rein-$today.sql.age" "$RUNNER_TEMP/dump/rein.sql"
          cp "$RUNNER_TEMP/dump/latest.json" latest.json
          for f in rein-*.sql.age; do
            d=${f#rein-}; d=${d%.sql.age}
            if [ "$d" \< "$cutoff" ]; then echo "expired: $f"; rm -f "$f"; fi
          done
          ls -1 rein-*.sql.age
          git add -A
          git commit -qm "postgres: $(ls rein-*.sql.age | wc -l) encrypted dumps, newest $today"
          git push -fq origin HEAD:postgres-dumps

      - name: Manifest
        if: steps.gate.outputs.enabled == 'true'
        run: cat "$RUNNER_TEMP/dump/latest.json"

      - name: Notify on failure
        if: failure() && env.REIN_TELEGRAM_BOT_TOKEN != ''
        run: >
          sh scripts/notify-telegram.sh
          "Rein nightly DATABASE dump FAILED -- no verified copy of the engine database tonight.
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
