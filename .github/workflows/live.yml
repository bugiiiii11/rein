name: Live

# The suites that spend real testnet money and talk to real third parties:
# the hosted x402 facilitator, Base Sepolia, the ERC-8004 registry, the
# Telegram Bot API, and (once Sprint 4 is deployed) the hosted engine.
#
# Kept OUT of ci.yml deliberately. CI runs on every push and pins RUN_LIVE to
# empty; settling payments is not something a push should decide to do, and
# these need secrets a fork's pull request must never see. This workflow is
# the opposite trade: rare, serialized, and allowed to spend.
on:
  schedule:
    # Daily, well off the hour -- these compete for a single funded wallet.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which live suite to run'
        required: false
        default: all
        type: choice
        options: [all, rails, gate, erc8004, telegram, engine]

# NEVER two spenders at once. The suites share one funded Sepolia wallet, and
# concurrent runs race on its nonce and its balance. Unlike ci.yml this does
# NOT cancel in progress: killing a run mid-settlement abandons a payment
# that is already on-chain.
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    name: live (Base Sepolia)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A fork's PR must never reach these secrets, and a schedule only ever
    # runs on the default branch anyway.
    if: github.event_name != 'pull_request'

    env:
      RUN_LIVE: '1'
      REIN_SEPOLIA_PRIVATE_KEY: ${{ secrets.REIN_SEPOLIA_PRIVATE_KEY }}
      REIN_SEPOLIA_VENDOR_ADDRESS: ${{ secrets.REIN_SEPOLIA_VENDOR_ADDRESS }}
      REIN_SEPOLIA_RPC_URL: ${{ secrets.REIN_SEPOLIA_RPC_URL }}
      REIN_SEPOLIA_ERC8004_ID: ${{ secrets.REIN_SEPOLIA_ERC8004_ID }}
      REIN_TELEGRAM_BOT_TOKEN: ${{ secrets.REIN_TELEGRAM_BOT_TOKEN }}
      REIN_TELEGRAM_CHAT_ID: ${{ secrets.REIN_TELEGRAM_CHAT_ID }}
      REIN_E2E_ENGINE_URL: ${{ secrets.REIN_E2E_ENGINE_URL }}
      REIN_ENGINE_API_KEY: ${{ secrets.REIN_ENGINE_API_KEY }}
      # NODE_EXTRA_CA_CERTS is deliberately absent: it is a local-machine
      # workaround for a MITM antivirus root, and setting it here would only
      # break a runner that has no such file.

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Fail in ten seconds with "fund the wallet" rather than twenty minutes
      # later with a facilitator error that means the same thing. An empty
      # wallet is the single most likely reason for a red run here, and it is
      # an operator task, not a code defect.
      - name: Preflight — wallet is funded
        run: node .github/scripts/live-preflight.mjs

      - name: Rails (facilitator + settlement on Base Sepolia)
        if: ${{ inputs.suite == 'all' || inputs.suite == 'rails' || inputs.suite == '' }}
        continue-on-error: true
        id: rails
        run: pnpm --filter @reinconsole/x402-rails exec vitest run src/live.test.ts --retry=1

      - name: Gate (vendor-side verify + settle)
        if: ${{ inputs.suite == 'all' || inputs.suite == 'gate' || inputs.suite == '' }}
        continue-on-error: true
        id: gate
        run: pnpm --filter @reinconsole/gate exec vitest run src/live.test.ts --retry=1

      - name: ERC-8004 (identity registry reads)
        if: ${{ inputs.suite == 'all' || inputs.suite == 'erc8004' || inputs.suite == '' }}
        continue-on-error: true
        id: erc8004
        run: pnpm --filter @reinconsole/erc8004 exec vitest run src/live.test.ts --retry=1

      - name: Telegram (a real challenge in the real chat)
        if: ${{ inputs.suite == 'all' || inputs.suite == 'telegram' || inputs.suite == '' }}
        continue-on-error: true
        id: telegram
        run: pnpm --filter @reinconsole/policy-engine exec vitest run src/channels.live.test.ts --retry=1

      # Skips itself when REIN_E2E_ENGINE_URL is unset, which is the state
      # until the hosted engine is deployed.
      - name: Engine e2e (against the hosted engine)
        if: ${{ inputs.suite == 'all' || inputs.suite == 'engine' || inputs.suite == '' }}
        continue-on-error: true
        id: engine
        run: pnpm --filter @reinconsole/store exec vitest run src/engine.e2e.live.test.ts --retry=1

      # Every suite runs even when an earlier one fails (continue-on-error),
      # because "the facilitator is down" should not hide "Telegram is also
      # down". This step is what actually fails the run.
      - name: Summary
        if: always()
        run: |
          {
            echo '## Live suites'
            echo ''
            echo '| Suite | Result |'
            echo '|---|---|'
            echo "| rails | ${{ steps.rails.outcome }} |"
            echo "| gate | ${{ steps.gate.outcome }} |"
            echo "| erc8004 | ${{ steps.erc8004.outcome }} |"
            echo "| telegram | ${{ steps.telegram.outcome }} |"
            echo "| engine | ${{ steps.engine.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=""
          for pair in \
            "rails:${{ steps.rails.outcome }}" \
            "gate:${{ steps.gate.outcome }}" \
            "erc8004:${{ steps.erc8004.outcome }}" \
            "telegram:${{ steps.telegram.outcome }}" \
            "engine:${{ steps.engine.outcome }}"; do
            name="${pair%%:*}"
            outcome="${pair##*:}"
            if [ "$outcome" = "failure" ]; then failed="$failed $name"; fi
          done

          if [ -n "$failed" ]; then
            echo "live suites failed:$failed" >&2
            echo "FAILED_SUITES=$failed" >> "$GITHUB_ENV"
            exit 1
          fi
          echo 'all live suites passed (or skipped)'

      # The same channel a production escalation would page, which also makes
      # this a standing end-to-end check that the channel still works.
      - name: Notify on failure
        if: failure() && env.REIN_TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${REIN_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${REIN_TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Rein live run failed:${FAILED_SUITES:- see logs} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
