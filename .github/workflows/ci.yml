name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The live tests hit Base Sepolia with a funded key and self-skip unless
  # RUN_LIVE is set (see packages/gate/src/live.test.ts and friends). CI must
  # never set it: no secrets here, and settling real payments on every push is
  # not something a test run should decide to do. Pinned empty so a repo-level
  # variable cannot switch them on by accident.
  RUN_LIVE: ''

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the others -- cross-platform drift
      # is the specific thing this matrix exists to surface.
      fail-fast: false
      matrix:
        include:
          # Linux is the reference platform and carries the Node version range
          # claimed by "engines": { "node": ">=22" }.
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          # Windows is where every finding of the S31 journey test lived.
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # The store on a NETWORK Postgres (Sprint 11), the driver the hosted engine
  # runs on Supabase. Every other job tests PGlite only. REIN_TEST_DATABASE_URL
  # turns store.test.ts's data dirs into schemas and un-skips pg-db.test.ts and
  # migrate.test.ts; only those files read it, so only those run here. Linux
  # only: service containers are a Linux-runner feature. Major = Supabase's.
  test-postgres:
    name: test (store on postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: rein
          POSTGRES_DB: rein
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      REIN_TEST_DATABASE_URL: postgres://postgres:rein@127.0.0.1:5432/rein
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test the store against Postgres
        run: pnpm --filter @reinconsole/store exec vitest run src/store.test.ts src/pg-db.test.ts src/migrate.test.ts

  # macOS bills at a 10x minute multiplier on private repos, so it does not run
  # per push -- trigger it manually (workflow_dispatch) when a release or a
  # platform-sensitive change warrants it.
  test-macos:
    name: test (macos-latest, node 22)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  audit:
    name: audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No `cache: pnpm` here, unlike the other jobs: this one deliberately
          # never installs (see the note below), so the pnpm store never exists
          # and setup-node's post-run cache save fails the whole job with a Path
          # Validation Error -- a passing audit reported as a red run (S59).

      # --prod because a dev-only advisory does not ship to anyone: it would
      # turn this gate into noise that gets ignored, which is how the real
      # finding gets missed. high and above, because "moderate" on a transitive
      # dev-adjacent package is where an audit stops being actionable.
      #
      # An advisory with NO fix available goes in package.json's
      # pnpm.auditConfig.ignoreGhsas WITH a dated entry under SECURITY.md's
      # "Known advisories" -- an ignore with no expiry and no reason is how a
      # permanent hole gets shipped as a config line nobody rereads.
      #
      # No install step: `pnpm audit` reads the lockfile, so this job stays
      # fast and cannot be influenced by whatever an install would run.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  package-smoke:
    name: package smoke (pack -> install -> import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Everything else in this repo tests workspace source. This is the only
      # job that consumes the packages the way npm users do, so a broken
      # `exports` map, a missing `files` entry or an unbuilt `bin` fails here
      # instead of after publish.
      - name: Pack, install and import as a consumer
        run: pnpm smoke
