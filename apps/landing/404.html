<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      document.documentElement.classList.add('js');
    </script>
    <title>Page not found — Rein</title>
    <!-- Served with status 404 by Cloudflare Pages and Vercel for any unknown path, so every
         link here is absolute: the page can render at any depth. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/landing.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <header class="nav">
      <a class="brand" href="/" aria-label="Rein — home">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="7" cy="16" r="5" stroke="currentColor" stroke-width="2.2" />
          <circle cx="25" cy="16" r="5" stroke="currentColor" stroke-width="2.2" />
          <path d="M12 16 H20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <path d="M16 12 V20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        <span class="brand-name">REIN</span>
      </a>
      <a class="btn btn-primary nav-cta" href="/get-started">Get started</a>
    </header>

    <main>
      <div class="page-wrap">
        <header class="page-hero">
          <nav class="eyebrow qa-crumbs reveal" aria-label="Breadcrumb"><span class="idx">§</span><span class="tick"></span><a href="/">Rein</a><span class="sep">/</span>404</nav>
          <h1 class="reveal d1">Page not found</h1>
          <p class="reveal d2">Nothing lives at this address. Try the <a href="/">overview</a>, <a href="/get-started">Get started</a> or the <a href="/whitepaper">whitepaper</a>.</p>
        </header>
      </div>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
